<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜地域情報室</title>
<meta name="robots" content="noindex">
<script>
(function(){
  var p=location.pathname;
  if(/^\/(suita-toyonaka|minoh)(\/|$)/.test(p)){
    var base="https://suita-toyonaka-minoh.pages.dev/";
    var known=["guide","map","areas","meibutsu","matsuri","shukuhaku","kotsu","unei"];
    var m=p.match(/\/([a-z]+)\.html$/);
    location.replace((m&&known.indexOf(m[1])>-1)?base+m[1]+".html":base);
  }
})();
</script>
<style>
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:#1D2433;background:#FAFBF7;line-height:1.85}
main{max-width:640px;margin:0 auto;padding:64px 20px}
h1{color:#1F3A68;font-size:1.6rem}
a{color:#2D5392}
</style>
</head>
<body>
<main>
<h1>ページが見つかりません</h1>
<p>お探しのページは移動または削除された可能性があります。</p>
<p><a href="https://leben-k.github.io/">地域情報室のトップページへ戻る</a></p>
</main>
</body>
</html>
